services:
  postgres:
    image: postgres:15-alpine
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-faceattend}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-faceattend}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-faceattend}}

    ports:
      - "${BACKEND_PORT:-8000}:8000"

    depends_on:
      postgres:
        condition: service_healthy

    command:
      [
        "sh",
        "-c",
        "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
      ]

  ai-service:
    build:
      context: ./apps/ai-service

    env_file:
      - .env

    ports:
      - "${AI_SERVICE_HOST_PORT:-8002}:8000"

    volumes:
      - ./apps/ai-service/.insightface:/root/.insightface

volumes:
  postgres_data: